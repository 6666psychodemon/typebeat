<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Genre map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/tokens.css?v=genre-map-1" />
  <link rel="stylesheet" href="/static/map.css?v=genre-map-1" />
</head>
<body>
  <header class="map-bar">
    <a class="map-back" href="/">Radio</a>
    <label class="map-search">
      <span class="visually-hidden">Find a style or parent</span>
      <input id="q" type="search" placeholder="Style or parent" autocomplete="off" enterkeyhint="search" />
    </label>
    <p id="q-status" class="map-status" aria-live="polite"></p>
    <div class="map-zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button type="button" id="zoom-fit">Fit</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
      </button>
    </div>
  </header>

  <div id="board" class="map-board" tabindex="0" aria-label="Genre map. Drag to move, scroll to zoom.">
    <div id="world" class="map-world"></div>
    <p id="board-status" class="map-board-status">Loading the map.</p>
    <button type="button" id="retry" class="map-retry" hidden>Try again</button>
  </div>

  <aside id="sheet" class="map-sheet" hidden aria-labelledby="sheet-title">
    <button type="button" class="map-sheet__close" id="sheet-close">Close</button>
    <h2 id="sheet-title"></h2>
    <p id="sheet-stored" class="map-stored" hidden></p>
    <p id="sheet-relation"></p>
    <p id="sheet-def"></p>
    <h3 id="sheet-diff-label">Different from</h3>
    <p id="sheet-diff"></p>
    <h3 id="sheet-artists-label">Artists</h3>
    <div id="sheet-artists" class="map-artists"></div>
    <p id="sheet-station" class="map-station" hidden></p>
  </aside>

  <script src="/static/map.js?v=genre-map-1"></script>
</body>
</html>
